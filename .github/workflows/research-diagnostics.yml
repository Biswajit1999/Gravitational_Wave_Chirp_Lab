name: GW strain research diagnostics
on:
  pull_request:
  push:
    branches: ['research/**']
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2.0,<3'
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_observations.py
      - run: python tools/run_strain_diagnostics.py
