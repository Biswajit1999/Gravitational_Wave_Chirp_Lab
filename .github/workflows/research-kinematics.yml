name: Scientific kinematics checks
on:
  pull_request:
  push:
    branches: [research/2026-11-11-kinematics]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_research_kinematics.py
